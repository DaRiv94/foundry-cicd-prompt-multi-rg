name: Dev

# Every push to a feature branch deploys that branch's agent to dev and smoke tests it.

on:
  push:
    branches-ignore: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: dev-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  dev:
    uses: ./.github/workflows/deploy-stage.yml
    with:
      env: dev
