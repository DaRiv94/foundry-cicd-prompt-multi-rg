name: Release

# A push to main is a release candidate. The same commit moves through three stages:
#   dev  : deploy + smoke test
#   test : deploy + smoke test + evaluation gate (a failing gate stops the run here)
#   prod : waits for the required reviewer, deploys, pins the endpoint, smoke tests the pin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/deploy-stage.yml
    with:
      env: dev

  test:
    needs: dev
    uses: ./.github/workflows/deploy-stage.yml
    with:
      env: test

  prod:
    needs: test
    uses: ./.github/workflows/deploy-stage.yml
    with:
      env: prod
